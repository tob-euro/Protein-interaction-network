# ── Data ─────────────────────────────────────────────────────────────────────

data:
  path: data/results_PHYSICAL_Prob_Model_16_02_26.csv
  random_state: 42

# ── Model ────────────────────────────────────────────────────────────────────

model:
  type: multimodal        # ldm | multimodal
  latent_dim: 32

# ── Split ────────────────────────────────────────────────────────────────────
# transductive: gene-pair level split — all isoforms appear in training pairs
# inductive:    isoform-level split  — held-out isoforms never appear in training pairs

split:
  mode: inductive         # transductive | inductive
  val_fraction: 0.1       # fraction of data held out for validation
  test_fraction: 0.2      # fraction of data held out for testing

# ── Training ─────────────────────────────────────────────────────────────────

training:
  epochs: 10
  learning_rate: 0.001
  batch_size: 512
  weight_decay: 1.0e-5
  num_workers: 0          # set to 0 on macOS/MPS
  patience: 10            # epochs without val AP improvement before early stopping

# ── Multimodal settings (only used when model.type = multimodal) ─────────────

multimodal:
  esmc_path: data/esmc_globemb_noduplicates_15092025.csv
  lambda_iso: 1.0         # loss weight: isoform–isoform pairs
  lambda_gene: 0.0        # loss weight: gene–isoform bipartite
  lambda_complex: 0.0     # loss weight: gene–gene STRING (0 = disabled)
  neg_ratio: 10            # negatives per positive gene–isoform edge
  batch_size: 512         # batch size for gene–isoform and gene–gene loaders
  
# ── Visualization ────────────────────────────────────────────────────────────

visualization:
  pca_components: 2
  pca_max_components: 50
  label_top_n: 20
  clustering_n_clusters: null
  clustering_n_clusters_max: 20
  clustering_truncate_level: 10

# ── Paths ────────────────────────────────────────────────────────────────────

paths:
  models_dir: models
  results_dir: results/figures
