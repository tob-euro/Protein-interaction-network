# ── Data ─────────────────────────────────────────────────────────────────────

data:
  path: data/results_PHYSICAL_Prob_Model_16_02_26.csv
  random_state: 42

# ── Model ────────────────────────────────────────────────────────────────────

model:
  type: multimodal        # ldm | multimodal
  latent_dim: 2

# ── Split ────────────────────────────────────────────────────────────────────
# transductive:   gene-pair level split — all isoforms appear in training pairs
# inductive:      isoform-level split  — held-out isoforms never appear in training pairs
# inductive_gene: gene-level split     — all isoforms of a gene are held out together
#                                        (no within-gene leakage; recommended)

split:
  mode: inductive_gene    # transductive | inductive | inductive_gene
  val_fraction: 0.1       # fraction of data held out for validation
  test_fraction: 0.2      # fraction of data held out for testing

# ── Training ─────────────────────────────────────────────────────────────────

training:
  epochs: 15
  learning_rate: 0.001
  batch_size: 1024
  weight_decay: 1.0e-5
  num_workers: 4          # set to 0 on macOS/MPS
  patience: 5            # epochs without val AP improvement before early stopping

# ── Multimodal settings (only used when model.type = multimodal) ─────────────

multimodal:
  esmc_path: data/esmc_globemb_noduplicates_15092025.csv
  use_residuals: False     # add per-isoform residual on top of ESM-C projection
  proj_hidden_dim: 16      # hidden dim of ESM-C projection and random-effect MLPs
  lambda_iso_iso: 1.0      # loss weight: iso–iso pairs
  lambda_gene_iso: 0.5     # loss weight: gene–iso bipartite
  lambda_gene_gene: 0.25   # loss weight: gene–gene STRING (0 = disabled)
  neg_ratio: 10             # negatives per positive gene–iso edge
  batch_size: 1024           # batch size for gene–iso and gene–gene loaders
  
# ── Visualization ────────────────────────────────────────────────────────────

visualization:
  pca_components: 2
  pca_max_components: 50
  label_top_n: 20
  clustering_n_clusters: null
  clustering_n_clusters_max: 20
  clustering_truncate_level: 10

# ── Paths ────────────────────────────────────────────────────────────────────

paths:
  models_dir: models
  results_dir: results/figures
